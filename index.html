<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Óptica Bellavista</title>
  <meta name="description" content="Enlaces oficiales de Óptica Bellavista: WhatsApp, Instagram y Facebook." />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #eaf8f4, #cfece4);
      color: #123b32;
    }
    .card {
      width: 100%; max-width: 430px; background: #fff; border-radius: 28px;
      padding: 36px 24px 30px; text-align: center;
      box-shadow: 0 18px 55px rgba(18,93,76,.18);
      border: 1px solid rgba(35,130,108,.12);
    }
    .logo {
      width: 92px; height: 92px; margin: 0 auto 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg,#44a88c,#246f5e); color:#fff;
      font-size:34px; font-weight:700; letter-spacing:1px;
      box-shadow:0 10px 28px rgba(36,111,94,.28);
    }
    h1 { font-size: 29px; margin-bottom: 8px; color:#1e6655; }
    .subtitle { font-size:15px; line-height:1.5; color:#638078; margin-bottom:28px; }
    .links { display:grid; gap:14px; }
    .btn {
      min-height:58px; display:flex; align-items:center; justify-content:center;
      border-radius:16px; text-decoration:none; font-size:17px; font-weight:700;
      transition:transform .2s ease, box-shadow .2s ease;
    }
    .btn:hover { transform:translateY(-2px); box-shadow:0 8px 22px rgba(27,104,86,.15); }
    .whatsapp { background:#2b8c74; color:#fff; }
    .instagram, .facebook { background:#fff; color:#246f5e; border:2px solid #2b8c74; }
    .footer { margin-top:26px; font-size:12px; line-height:1.5; color:#82958f; }
    @media (max-width:480px) {
      .card { padding:30px 18px 26px; }
      h1 { font-size:25px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">OB</div>
    <h1>Óptica Bellavista</h1>
    <p class="subtitle">Conéctate con nosotros y elige el medio que prefieras.</p>
    <div class="links">
      <a class="btn whatsapp" href="https://wa.me/message/5XPJQ3GQKWF5A1" target="_blank" rel="noopener noreferrer">WhatsApp</a>
      <a class="btn instagram" href="https://www.instagram.com/bella_vistaopt?stkn=NWtlcjlnOHFrcnBn" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a class="btn facebook" href="https://www.facebook.com/share/14ka3WfQqdE/" target="_blank" rel="noopener noreferrer">Facebook</a>
    </div>
    <p class="footer">Enlaces oficiales de Óptica Bellavista</p>
  </main>
</body>
</html>
